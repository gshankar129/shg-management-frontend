<header class="app-header">
  <div class="header-left">
    <button type="button" class="toggle-btn" (click)="toggleSidebar.emit()" aria-label="Toggle menu">
      ☰
    </button>
    <div class="brand">
      <span class="brand-icon">🤝</span>
      <span class="brand-name">SHG Manager</span>
    </div>
  </div>

  <div class="header-right">
    @if (userName()) {
      <span class="user-greeting">Namaste, <strong>{{ userName() }}</strong></span>
    }
    <button type="button" class="btn-logout" (click)="onLogout()" title="Logout">
      <span aria-hidden="true">🚪</span>
      <span class="logout-text">Logout</span>
    </button>
  </div>
</header>
