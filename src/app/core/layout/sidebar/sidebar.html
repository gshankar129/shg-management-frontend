@let profile = userProfile$ | async;

<aside class="app-sidebar" [class.collapsed]="isCollapsed">

  <div class="user-info">
    @if (profile) {
      <div class="avatar">{{ (profile.userName || 'S').charAt(0) }}</div>
      <h3>{{ profile.userName }}</h3>
      <p>{{ profile.role }} • {{ profile.shgName || 'No Group' }}</p>
    } @else {
      <div class="avatar skeleton"></div>
      <div class="skeleton-line"></div>
    }
  </div>

  <nav class="nav-menu" aria-label="Main menu">
    <a class="nav-item" routerLink="/member" routerLinkActive="active"
       ariaCurrentWhenActive="page" title="My Profile & Passbook">
      <span class="nav-icon" aria-hidden="true">📒</span>
      <span class="nav-label">Passbook</span>
    </a>

    <a class="nav-item" routerLink="/loans" routerLinkActive="active"
       ariaCurrentWhenActive="page" title="Loans & Repayment">
      <span class="nav-icon" aria-hidden="true">💳</span>
      <span class="nav-label">Loans</span>
    </a>

    <a class="nav-item" routerLink="/all-members" routerLinkActive="active"
       ariaCurrentWhenActive="page" title="All Members">
      <span class="nav-icon" aria-hidden="true">👥</span>
      <span class="nav-label">Members</span>
    </a>

    <a class="nav-item" routerLink="/meetings" routerLinkActive="active"
      ariaCurrentWhenActive="page" title="Meetings">
      <span class="nav-icon" aria-hidden="true">📅</span>
      <span class="nav-label">Meetings</span>
    </a>

    @if (role === 'ADMIN') {
      <a class="nav-item" routerLink="/savings/record" routerLinkActive="active"
         ariaCurrentWhenActive="page" title="Record Savings">
        <span class="nav-icon" aria-hidden="true">💰</span>
        <span class="nav-label">Savings</span>
      </a>

      <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active"
         ariaCurrentWhenActive="page" title="Waiting to Join">
        <span class="nav-icon" aria-hidden="true">📋</span>
        <span class="nav-label">Requests</span>
      </a>
    }
  </nav>
</aside>
