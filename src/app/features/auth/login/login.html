<div class="login-container">
  <div class="login-card">
    <h2>SHG Portal Login</h2>

    @if (errorMessage) {
      <div class="error-alert">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          [(ngModel)]="credentials.email"
          required
          email
          placeholder="Enter email address"
          #emailInput="ngModel"
        />
        @if (emailInput.invalid && (emailInput.touched || loginForm.submitted)) {
          <small class="field-error">Enter a valid email address</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Enter password"
          #passwordInput="ngModel"
        />
        @if (passwordInput.invalid && (passwordInput.touched || loginForm.submitted)) {
          <small class="field-error">Password is required</small>
        }
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p>New user? <a routerLink="/auth/register">Register now</a></p>
  </div>
</div>
